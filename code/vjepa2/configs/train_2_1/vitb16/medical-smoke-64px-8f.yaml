  - 1.0
  reprob: 0.0
img_data:
  batch_size: 1
  crop_size: 64
  dataset_fpcs:
  - 1
  dataset_type: VideoDataset
  datasets:
  - $VJEPA2_MIMIC_DATA
  datasets_weights:
  - 1.0
  num_workers: 0
  rank_ratio: 0.25
img_mask:
