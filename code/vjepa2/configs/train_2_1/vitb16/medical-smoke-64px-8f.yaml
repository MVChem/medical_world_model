  use_mask_tokens: true
  use_rope: true
  zero_init_mask_tokens: true
optimization:
  betas:
  - 0.9
  - 0.999
  ema:
  - 0.99925
  - 0.99925
  epochs: 1
  eps: 1.0e-08
  final_lr: 0.0001
  final_weight_decay: 0.04
  ipe: 1
  ipe_scale: 1.0
  is_anneal: false
  lr: 0.0001
  start_lr: 0.00001
  warmup: 0
  weight_decay: 0.04
