[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimic-vla-jepa-baseline"
version = "0.1.0"
description = "Leakage-safe MIMIC VLA-JEPA frozen-bottleneck baseline"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["MIMIC_example", "mimic_vla_jepa"]

[tool.ruff.lint.per-file-ignores]
"MIMIC_example/__init__.py" = ["N999"]
