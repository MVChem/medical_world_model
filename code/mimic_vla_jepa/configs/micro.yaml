predictor:
  image_size: 256
  patch_size: 16
  state_dim: 2048
  action_dim: 2560
  query_tokens: 24
  predictor_dim: 512
  depth: 2
  heads: 8
  activation_checkpointing: false

train:
  seed: 42
  batch_size: 1
  max_steps: 5
  learning_rate: 1.0e-4
  weight_decay: 1.0e-8
  betas: [0.9, 0.95]
  grad_clip: 1.0
  log_every: 1
  checkpoint_every: 0
