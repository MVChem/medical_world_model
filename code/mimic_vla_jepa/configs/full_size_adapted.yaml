predictor:
  image_size: 256
  patch_size: 16
  state_dim: 2048
  action_dim: 2560
  query_tokens: 24
  predictor_dim: 1024
  depth: 12
  heads: 8
  activation_checkpointing: true

train:
  seed: 42
  batch_size: 1
  max_steps: 2000
  learning_rate: 1.0e-5
  weight_decay: 1.0e-8
  betas: [0.9, 0.95]
  grad_clip: 1.0
  log_every: 10
  checkpoint_every: 500
