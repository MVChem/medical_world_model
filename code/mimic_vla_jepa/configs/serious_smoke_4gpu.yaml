predictor:
  image_size: 256
  patch_size: 16
  state_dim: 2048
  action_dim: 2560
  query_tokens: 24
  predictor_dim: 1024
  depth: 12
  heads: 8
  activation_checkpointing: true

qwen:
  query_token: "<|latent_0|>"
  query_tokens: 24
  image_size: 224
  max_length: 2048
  gradient_checkpointing: true

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_b
    - in_proj_a
    - out_proj

train:
  seed: 42
  expected_world_size: 4
  train_split: train
  eval_split: validate
  batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 1
  max_steps: 1
  # The step cap ends this smoke quickly; the required wall-clock guard remains.
  max_duration_hours: 24.0
  predictor_learning_rate: 1.0e-5
  lora_learning_rate: 2.0e-5
  query_learning_rate: 1.0e-4
  warmup_fraction: 0.03
  min_lr_ratio: 0.1
  weight_decay: 1.0e-8
  betas: [0.9, 0.95]
  grad_clip: 1.0
  log_every: 1
  checkpoint_interval_hours: 8.0
  eval_interval_hours: 8.0
  eval_at_start: true
  max_eval_examples: 4
